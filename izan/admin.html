<script>
let backOk = false, guides = [], guidesOk = false, guidesErr = null, gDraft = null, weights = [], weightsOk = false, weightsErr = null, wDraft = null, movements = [], movementsErr = null;
let cats = [], products = [], codes = [], orders = [], ordersErr = null, codesErr = null, tiers = parseTiers(), countMode = 'ref', settings = { whatsapp: C.WHATSAPP, hero_banners: [], home_tiles: [], visual_content: {} }, lastCat = '', logged = null, busy = false;
const MODAL_OK = 'Sí, eliminar';

function ask(q) { return new Promise(r => { $('#mq').textContent = q; $('#my').textContent = MODAL_OK; $('#mn').textContent = 'Cancelar'; $('#mo').classList.add('on'); const f = v => { $('#mo').classList.remove('on'); r(v); }; $('#my').onclick = () => f(true); $('#mn').onclick = () => f(false); }); }
function modal(html, okText, onOk) {
  $('#mq').innerHTML = html; $('#my').textContent = okText; $('#mn').textContent = 'Cancelar'; $('#mo').classList.add('on');
  const close = () => { $('#mo').classList.remove('on'); $('#my').textContent = MODAL_OK; };
  $('#my').onclick = async () => { if (await onOk() !== false) close(); };
  $('#mn').onclick = close;
}
const say = (id, t) => { const m = $('#' + id); if (m) m.textContent = t; };

/* ---- selector de niveles de descuento (casillas) ---- */
const tierName = t => t.kind === 'pct' ? `${t.pct}% (desde ${t.min} uds)` : `${t.name} (${tierReq(tiers, t)}, precio propio)`;
const tierBoxes = (pre, on) => tiers.map(t => `<label class="tk"><input type="checkbox" id="${pre}${t.key}" ${on.includes(t.key) ? 'checked' : ''}> ${esc(tierName(t))}</label>`).join('');
const readBoxes = pre => tiers.filter(t => $('#' + pre + t.key).checked).map(t => t.key);
const allKeys = () => tiers.map(t => t.key);
/* casilla "usar los de la categoría" + casillas propias. catSel = id del <select> de categoría */
function tierPicker(pre, own, catId) {
  const base = parseKeys(own) || effectiveCat(catId);
  return `<label class="tk"><input type="checkbox" id="${pre}inh" ${own == null || parseKeys(own) == null ? 'checked' : ''} onchange="togInh('${pre}','${catId || ''}')"> Usar los descuentos de la categoría</label>
    <div class="tierbox" id="${pre}box" ${parseKeys(own) == null ? 'hidden' : ''}>${tierBoxes(pre, base)}</div>`;
}
const effectiveCat = id => parseKeys((cats.find(c => c.id == id) || {}).tiers) || allKeys();
function togInh(pre, catSelOrId) {
  const inh = $('#' + pre + 'inh').checked; $('#' + pre + 'box').hidden = inh;
  if (!inh) { const el = $('#' + catSelOrId), id = el ? el.value : catSelOrId, keys = effectiveCat(id); tiers.forEach(t => $('#' + pre + t.key).checked = keys.includes(t.key)); }
}

const ADMIN_EMAIL = 'saenz1098@gmail.com';

/* MODO PRUEBA LOCAL: solo si NO hay Supabase configurado Y la página se abre desde este computador
   (localhost, 127.0.0.1 o archivo directo). En un sitio publicado nunca se activa: sigue cerrado. */
const DEV = LOCAL && (['localhost', '127.0.0.1', '[::1]'].includes(location.hostname) || location.protocol === 'file:');
async function seedDemo() {
  if ((await sb.from('categories').select()).data.length) return;
  const { data: [cat] } = await sb.from('categories').insert({ name: 'Camisetas oversized' });
  await sb.from('products').insert([
    { category_id: cat.id, name: 'Oversized Negra', description: 'Algodón pesado, corte oversized.', color: 'Negro', price: 120000, price_promo: 99000, stock_s: 5, stock_m: 8, stock_l: 8, stock_xl: 4, is_best_seller: true },
    { category_id: cat.id, name: 'Oversized Blanca', description: 'Sin promoción: se ve solo el precio normal.', color: 'Blanco', price: 110000, price_dist: 80000, price_mayor: 70000, stock_s: 6, stock_m: 6, stock_l: 6, stock_xl: 6 },
    { category_id: cat.id, name: 'Oversized Verde oliva', description: 'Promoción de ejemplo.', color: 'Verde oliva', price: 130000, price_promo: 104000, stock_s: 3, stock_m: 5, stock_l: 5, stock_xl: 2, is_new_arrival: true }
  ]);
}
async function init() {
  if (DEV) {
    await seedDemo();
    await showPanel();
    document.body.insertAdjacentHTML('afterbegin', '<div style="background:#343339;color:#fff;font:600 12px Inter,sans-serif;padding:8px 14px;text-align:center">MODO PRUEBA LOCAL · los datos viven solo en este navegador y no afectan tu tienda real</div>');
    return;
  }
  // Fail closed: nunca habilitar el panel usando el almacenamiento local simulado.
  if (LOCAL || !C.SUPABASE_URL || !C.SUPABASE_ANON_KEY || !window.supabase) {
    showLogin();
    say('lerr', 'Administración deshabilitada: configura Supabase en config.js.');
    $('#em').disabled = true; $('#pw').disabled = true;
    document.querySelector('#login button').disabled = true;
    return;
  }
  const { data, error } = await sb.auth.getSession();
  if (!error && data.session) {
    if ((data.session.user.email || '').toLowerCase() === ADMIN_EMAIL) await showPanel();
    else { await sb.auth.signOut(); showLogin(); say('lerr', 'Esta cuenta no tiene permisos de administrador.'); }
  } else showLogin();
  /* IMPORTANTE: este callback NO puede ser async ni llamar a sb.* directamente.
     supabase-js mantiene un bloqueo interno mientras corre el callback; si dentro se llama a
     getSession()/from()/storage, el bloqueo se queda esperando a sí mismo y TODAS las peticiones
     posteriores (guardar productos, subir fotos) quedan colgadas. Por eso se difiere con setTimeout
     y se ignoran los eventos que no cambian de usuario (TOKEN_REFRESHED, volver a la pestaña, etc.). */
  sb.auth.onAuthStateChange((evt, session) => {
    setTimeout(async () => {
      const ok = session && (session.user.email || '').toLowerCase() === ADMIN_EMAIL;
      if (ok) { if (!logged) await showPanel(); }
      else {
        if (session) await sb.auth.signOut();
        if (logged !== false) showLogin();
      }
    }, 0);
  });
}
function showLogin() { logged = false; $('#login').hidden = false; $('#panel').hidden = true; $('#out').hidden = true; }
async function showPanel() {
  if (DEV) { logged = true; $('#login').hidden = true; $('#panel').hidden = false; $('#out').hidden = false; await loadAll(); return; }
  if (LOCAL || !C.SUPABASE_URL || !C.SUPABASE_ANON_KEY) { showLogin(); say('lerr', 'Administración no disponible sin Supabase.'); return; }
  const { data, error } = await sb.auth.getSession();
  if (error || !data.session || (data.session.user.email || '').toLowerCase() !== ADMIN_EMAIL) {
    showLogin(); say('lerr', 'Esta cuenta no tiene permisos de administrador.'); return;
  }
  logged = true; $('#login').hidden = true; $('#panel').hidden = false; $('#out').hidden = false;
  await loadAll();
}
async function login() {
  if (LOCAL || !sb) return;
  say('lerr', 'Verificando credenciales…');
  const email = $('#em').value.trim().toLowerCase();
  if (email !== ADMIN_EMAIL) { say('lerr', 'Correo o contraseña incorrectos.'); return; }
  const { error } = await sb.auth.signInWithPassword({ email, password: $('#pw').value });
  say('lerr', error ? 'Correo o contraseña incorrectos.' : '');
}
async function logout() { if (sb && !LOCAL) await sb.auth.signOut(); }

let deletedRules = [];
async function loadAll() {
  const [c, p, s, k, o, mv] = await Promise.all([sb.from('categories').select('*').order('created_at'), sb.from('products').select('*').order('created_at', { ascending: false }), sb.from('settings').select('*'), sb.from('wholesale_codes').select('*').order('created_at', { ascending: false }), sb.from('orders').select('*').order('created_at', { ascending: false }), sb.from('inventory_movements').select('*').order('created_at', { ascending: false })]);
  codes = k.data || []; codesErr = k.error; orders = o.data || []; ordersErr = o.error; movements = mv.data || []; movementsErr = mv.error;
  cats = c.data || []; products = p.data || [];
  const g = await sb.from('size_guides').select('*').order('created_at'); guides = g.data || []; guidesOk = !g.error; guidesErr = g.error;
  const fw = await sb.from('fabric_weights').select('*').order('created_at'); weights = (fw.data || []).sort(weightSort); weightsOk = !fw.error; weightsErr = fw.error;
  backOk = LOCAL || (products.length ? ('image_path_back' in products[0]) : !(await sb.from('products').select('image_path_back')).error);
  const w = (s.data || []).find(r => r.key === 'whatsapp'); settings.whatsapp = (w && w.value) || C.WHATSAPP;
  const hb = (s.data || []).find(r => r.key === 'hero_banners'); settings.hero_banners = parseHeroAdmin(hb && hb.value);
  const vc = (s.data || []).find(r => r.key === 'visual_content'); settings.visual_content = parseVisualAdmin(vc && vc.value);
  const ht = (s.data || []).find(r => r.key === 'home_tiles'); settings.home_tiles = parseHeroAdmin(ht && ht.value);
  tiers = parseTiers(s.data); countMode = parseCountMode(s.data); deletedRules = parseDeletedRules(s.data);
  renderPanel();
}

/* ================= NAVEGACIÓN POR SECCIONES ================= */
const ICON = {
  home: '<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
  mail: '<path d="M4 5h16v14H4zM4 7l8 6 8-6"/>',
  image: '<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/>',
  tag: '<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  grid: '<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
  percent: '<path d="M19 5L5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',
  layers: '<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
  ruler: '<rect x="2" y="8" width="20" height="8" rx="1.5"/><path d="M6 8v3M10 8v4M14 8v3M18 8v4"/>',
  cart: '<circle cx="9" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/><path d="M2 3h3l2.4 12h11l2-8H6"/>',
  cog: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'
};
const ic = n => `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

/* Agotado = marcado manualmente o sin unidades en ninguna talla. Estas referencias salen de la tienda y de Venta física. */
const isAgotado = p => !!p.sold_out || !sizes(p).some(z => stock(p, z) > 0);
const VIEWS = [
  // Menú agrupado por tareas, manteniendo las pantallas y funciones existentes.
  { id: 'resumen', group: 'Resumen', ico: 'home', name: 'Resumen', desc: 'Una mirada rápida a cómo va tu tienda.' },
  { id: 'pedidos', group: 'Pedidos y cotizaciones', ico: 'mail', name: 'Pedidos y cotizaciones', desc: 'Revisa las cotizaciones que llegan desde el carrito y marca como vendidos los pedidos confirmados.' },
  { id: 'ventafisica', group: 'Pedidos y cotizaciones', ico: 'cart', name: 'Venta física', desc: 'Arma el ticket en el mostrador: toca un diseño, suma las tallas, aplica descuentos y mayoristas automáticamente y entrega el valor final al cliente.' },
  { id: 'catalogo', group: 'Productos e inventario', ico: 'grid', name: 'Catálogo', desc: 'Edita precios, fotos, inventario y estado de cada producto cargado.' },
  { id: 'agotados', group: 'Productos e inventario', ico: 'layers', name: 'Agotados', desc: 'Referencias sin inventario: no se ven en la tienda ni en Venta física. Cuando lleguen más unidades, repónlas y se reactivan.' },
  { id: 'destacados', group: 'Productos e inventario', ico: 'tag', name: 'Best sellers y Lo más nuevo', desc: 'Agrega o quita productos de Best sellers y Lo más nuevo con un solo clic.' },
  { id: 'nuevo', group: 'Productos e inventario', ico: 'plus', name: 'Nuevo producto', desc: 'Crea una referencia nueva con fotos, precios e inventario por talla.' },
  { id: 'categorias', group: 'Productos e inventario', ico: 'tag', name: 'Categorías', desc: 'Organiza el catálogo y define qué descuentos usa cada categoría.' },
  { id: 'gramajes', group: 'Productos e inventario', ico: 'layers', name: 'Gramajes', desc: 'Crea los gramajes de tela (g/m²) y elige cuál lleva cada producto para poder filtrarlos en la tienda.' },
  { id: 'guias', group: 'Productos e inventario', ico: 'ruler', name: 'Guías de tallas', desc: 'Guarda las medidas exactas por categoría y elige qué guía lleva cada producto.' },
  { id: 'reglas', group: 'Precios y mayoristas', ico: 'percent', name: 'Reglas de precios', desc: 'Descuentos por cantidad y condiciones de distribuidor y mayorista.' },
  { id: 'codigos', group: 'Precios y mayoristas', ico: 'key', name: 'Códigos mayorista', desc: 'Un código por cliente para que vea todo a precio mayorista.' },
  { id: 'campanas', group: 'Diseño de la tienda', ico: 'image', name: 'Campañas', desc: 'Crea campañas de portada con una sola imagen o con tres imágenes simétricas, y elige cuáles se muestran.' },
  { id: 'visual', group: 'Diseño de la tienda', ico: 'image', name: 'Contenido visual', desc: 'Elige el color de fondo de la tienda y edita avisos y textos del inicio.' },
  { id: 'pie', group: 'Diseño de la tienda', ico: 'image', name: 'Pie de página', desc: 'Edita cada texto del pie: marca, tienda, horario, contacto, redes y línea legal, con vista previa.' },
  { id: 'ajustes', group: 'Configuración', ico: 'cog', name: 'Configuración', desc: 'Configura los datos de contacto, WhatsApp y otras opciones de la tienda.' },
  { id: 'herramientas', group: 'Reportes y copias de seguridad', ico: 'grid', name: 'Inventario y reportes', desc: 'Ajustes de stock con historial, importación masiva y exportación de datos.' }
];
let view = (location.hash || '').slice(1), orderFilter = 'pending'; if (view === 'portada') view = 'campanas';
if (!VIEWS.some(v => v.id === view)) view = 'resumen';
const navOpen = new Set();
function navToggle(d) { const g = d.dataset.g; if (d.open) navOpen.add(g); else navOpen.delete(g); }
function admMenuToggle(force) {
  const pop = $('#admMenuPop'), btn = $('#admMenuBtn'); if (!pop || !btn) return;
  const open = typeof force === 'boolean' ? force : pop.hidden;
  pop.hidden = !open; btn.setAttribute('aria-expanded', open ? 'true' : 'false'); $('#admMenu').classList.toggle('open', open);
}
document.addEventListener('click', e => { const m = $('#admMenu'); if (m && !m.contains(e.target)) admMenuToggle(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const b = $('#admMenuBtn'); if (b && b.getAttribute('aria-expanded') === 'true') { admMenuToggle(false); b.focus(); } } });
function go(v) { view = v; try { history.replaceState(null, '', '#' + v); } catch (e) {} renderPanel(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VIEWS.some(v => v.id === h) && h !== view) { view = h; if (logged) renderPanel(); } });
const setOrderFilter = k => { orderFilter = k; renderPanel(); };
const isSold = o => o.status === 'sold';
const isReserved = o => o.status === 'reserved';
const isCancelled = o => o.status === 'cancelled';
const shortId = o => o.label || String(o.id).slice(0, 8).toUpperCase();

/* ================= SHELL ================= */
let catState = { q: '', c: 'all' }, lastRendered = null;
function renderPanel() {
  const cur = VIEWS.find(v => v.id === view) || VIEWS[0], pend = orders.filter(o => o.status === 'pending' || !o.status).length, nAgot = products.filter(isAgotado).length;
  const body = { resumen: vResumen, pedidos: vPedidos, ventafisica: vVentaFisica, campanas: vCampanas, visual: vVisual, pie: vPie, categorias: vCategorias, guias: vGuias, gramajes: vGramajes, nuevo: vNuevo, destacados: vDestacados, catalogo: vCatalogo, agotados: vAgotados, reglas: vReglas, codigos: vCodigos, ajustes: vAjustes, herramientas: vHerramientas }[cur.id]();
  document.title = cur.name + ' · Administrar · IZAN Clothes';
  /* Si se vuelve a dibujar la MISMA sección (tras guardar un cambio), se conserva la posición de la página. */
  const keepY = lastRendered === cur.id ? window.scrollY : null, pnl = $('#panel');
  if (keepY !== null && pnl) pnl.style.minHeight = pnl.offsetHeight + 'px';
  lastRendered = cur.id;
  /* Menú con desplegables: Resumen va suelto; el resto se agrupa. Abiertos: los que el usuario abrió + el de la sección actual. */
  navOpen.add(cur.group);
  const mobile = window.matchMedia('(max-width:900px)').matches;
  const link = v => `<button class="adm-link ${v.id === cur.id ? 'on' : ''}" onclick="go('${v.id}')" ${v.id === cur.id ? 'aria-current="page"' : ''}><span class="ico">${ic(v.ico)}</span><span class="lbl2">${v.name}</span>${v.id === 'pedidos' && pend ? `<em>${pend}</em>` : ''}${v.id === 'agotados' && nAgot ? `<em>${nAgot}</em>` : ''}</button>`;
  const groups = []; VIEWS.forEach(v => { if (v.group === 'Resumen') return; let g = groups.find(x => x.name === v.group); if (!g) groups.push(g = { name: v.group, items: [] }); g.items.push(v); });
  const nav = VIEWS.filter(v => v.group === 'Resumen').map(link).join('') + groups.map(g => `<details class="adm-grp" data-g="${esc(g.name)}" ${mobile || navOpen.has(g.name) ? 'open' : ''} ontoggle="navToggle(this)"><summary class="adm-group"><span>${g.name}</span>${g.name === 'Pedidos y cotizaciones' && pend ? `<em class="adm-dot">${pend}</em>` : ''}</summary>${g.items.map(link).join('')}</details>`).join('');
  const popNav = `<div class="adm-col"><p class="adm-pop-g">Inicio</p>${VIEWS.filter(v => v.group === 'Resumen').map(link).join('')}</div>` +
    groups.map(g => `<div class="adm-col"><p class="adm-pop-g">${g.name}</p>${g.items.map(link).join('')}</div>`).join('');
  $('#panel').innerHTML = `<div class="adm-shell">
    <div class="adm-menu" id="admMenu">
      <button type="button" class="adm-menu-btn" id="admMenuBtn" aria-haspopup="true" aria-expanded="false" aria-controls="admMenuPop" onclick="admMenuToggle()">
        <span class="adm-burger" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="adm-menu-cur"><small>Menú · ${cur.group}</small><b>${cur.name}</b></span>
        ${pend ? `<em class="adm-dot">${pend}</em>` : ''}
        <span class="adm-caret" aria-hidden="true"></span>
      </button>
      <nav class="adm-pop" id="admMenuPop" aria-label="Secciones de administración" hidden>${popNav}</nav>
    </div>
    <nav class="adm-side" aria-label="Secciones de administración">${nav}</nav>
    <section class="adm-main" aria-live="polite">
      <div class="adm-head"><div><p class="eyebrow">${cur.group}</p><h2>${cur.name}</h2><p class="note">${cur.desc}</p></div></div>
      ${body}
    </section></div>`;
  renderHeroAdminList();
  if (cur.id === 'catalogo') filterCatalog();
  if (cur.id === 'ventafisica') posRenderAll(); else if (typeof posClose === 'function') posClose();
  if (keepY !== null) { window.scrollTo(0, keepY); if (pnl) pnl.style.minHeight = ''; }
  const nv = $('.adm-side'), on = $('.adm-link.on');
  if (nv && on && nv.scrollWidth > nv.clientWidth) nv.scrollLeft = Math.max(0, on.offsetLeft - 16);
}

/* ================= VISTAS ================= */
function vResumen() {
  const pend = orders.filter(o => o.status === 'pending' || !o.status), agotados = products.filter(isAgotado), lowStock = products.filter(p => !p.sold_out && SZ.some(z => stock(p,z)>0 && stock(p,z)<=3));

function stockQuoteConflicts() {
  // Una alerta aparece cuando el stock real es exactamente 1 y dos o más
  // cotizaciones pendientes solicitan la misma referencia y talla.
  const pending = orders.filter(o => o.status === 'pending' || isReserved(o));
  const buckets = new Map();
  for (const o of pending) {
    for (const item of (Array.isArray(o.items) ? o.items : [])) {
      const size = String(item.size || '').toUpperCase();
      if (!['S','M','L','XL'].includes(size)) continue;
      const product = products.find(p => String(p.id) === String(item.product_id)) ||
        products.find(p => String(p.name || '').trim().toLowerCase() === String(item.product_name || '').trim().toLowerCase());
      if (!product || stock(product, size) !== 1) continue;
      const key = `${product.id}::${size}`;
      if (!buckets.has(key)) buckets.set(key, { product, size, orders: [] });
      const bucket = buckets.get(key);
      if (!bucket.orders.some(x => String(x.order.id) === String(o.id))) bucket.orders.push({ order: o, item });
    }
  }
  return [...buckets.values()].filter(x => x.orders.length > 1);
}

function stockConflictPanel() {
  const conflicts = stockQuoteConflicts();

  return `<section class="panel" style="border:1px solid #d97706;background:#fffaf0">

async function restockSold(id) {
  const p = products.find(x => x.id == id); if (!p) return;
  const add = {}; let total = 0;
  sizes(p).forEach(z => { const el = document.getElementById(`rs-${id}-${z}`), n = Math.max(0, parseInt(el && el.value) || 0); if (n) { add[z] = n; total += n; } });
  const hasStock = SZ.some(z => stock(p, z) > 0);
  if (!total && !hasStock) return alert('Escribe cuántas unidades llegaron en al menos una talla.');
  const resumen = total ? Object.entries(add).map(([z, n]) => `${z}: +${n}`).join(', ') : 'sin cambios de inventario';
  if (!await ask(`¿Reactivar “${p.name}”? (${resumen}). Volverá a verse en la tienda y en Venta física.`)) return;
  const update = { sold_out: false };
  Object.entries(add).forEach(([z, n]) => update['stock_' + z.toLowerCase()] = stock(p, z) + n);
  const { error } = await sb.from('products').update(update).eq('id', id);
  if (error) return alert('No se pudo reactivar: ' + error.message);
  if (total) {
    const rows = Object.entries(add).map(([z, n]) => ({ product_id: id, product_name: p.name, size: z, delta: n, before_stock: stock(p, z), after_stock: stock(p, z) + n, reason: 'Reposición (reactivado desde Agotados)', source: 'manual' }));

async function adjustStock() {
  const id=$('#mvproduct').value, size=$('#mvsize').value, delta=Number($('#mvdelta').value), reason=$('#mvreason').value.trim(), p=products.find(x=>x.id===id);
  if(!p) return say('mvmsg','Selecciona un producto válido.');
  if(!Number.isInteger(delta)||delta===0) return say('mvmsg','El cambio debe ser un número entero distinto de cero.');
  if(!reason) return say('mvmsg','Escribe el motivo del movimiento.');
  const before=stock(p,size), after=before+delta;
  if(after<0) return say('mvmsg',`No se puede dejar inventario negativo. Disponible: ${before}.`);
  if(!await ask(`Confirmar ajuste de ${delta>0?'+':''}${delta} unidades para ${p.name}, talla ${size}. Stock: ${before} → ${after}.`)) return;
  const col='stock_'+size.toLowerCase();
  const {error}=await sb.from('products').update({[col]:after,sold_out: after===0 && !SZ.some(z=>z!==size&&stock(p,z)>0)}).eq('id',id);
  if(error) return say('mvmsg','No se pudo actualizar el stock: '+error.message);
  const {error: logError}=await sb.from('inventory_movements').insert({product_id:id,product_name:p.name,size,delta,before_stock:before,after_stock:after,reason,source:'manual'});
  await loadAll();
  if(logError) { say('mvmsg','Stock actualizado, pero no se guardó el historial. Ejecuta la migración SQL y registra el movimiento manualmente si lo necesitas.'); return; }
  say('mvmsg','Inventario actualizado e historial guardado ✓');
}

function parseCsv(text) {
  const rows=[]; let row=[],cell='',quoted=false;
  for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++;}else if(c==='"')quoted=false;else cell+=c;}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell='';}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell='';}else cell+=c;}
  if(cell.length||row.length){row.push(cell.replace(/\r$/,''));rows.push(row);} return rows.filter(r=>r.some(v=>String(v).trim()!==''));
}
async function importProductsCsv(file) {
  if(!file) return;
  try {
    const rows=parseCsv(await file.text()); if(rows.length<2) throw new Error('El CSV no contiene filas de productos.');
    const headers=rows[0].map(h=>h.trim().replace(/^\ufeff/,'')), required=['id']; if(!required.every(k=>headers.includes(k))) throw new Error('Falta la columna id. Descarga primero el CSV de inventario desde este panel.');
    const allowed=['name','category_id','description','price','price_promo','price_dist','price_mayor','stock_s','stock_m','stock_l','stock_xl','sold_out','color'];
    const updates=[]; const seen=new Set();
    for(let i=1;i<rows.length;i++) { const obj={};headers.forEach((h,j)=>obj[h]=(rows[i][j]??'').trim()); const id=obj.id; if(!id) continue; if(seen.has(id)) throw new Error(`ID repetido en la fila ${i+1}.`); seen.add(id); if(!products.some(p=>p.id===id)) throw new Error(`El ID de la fila ${i+1} no existe en el catálogo. No se importó nada.`);
      const upd={}; allowed.forEach(k=>{if(headers.includes(k)&&obj[k]!==undefined){if(['price','price_promo','price_dist','price_mayor','stock_s','stock_m','stock_l','stock_xl'].includes(k)){if(obj[k]==='') return;const n=Number(obj[k]);if(!Number.isInteger(n)||n<0) throw new Error(`Valor inválido en ${k}, fila ${i+1}. Debe ser un entero igual o mayor que cero.`);upd[k]=n;}else if(k==='sold_out'){if(obj[k]!=='')upd[k]=['true','1','sí','si'].includes(obj[k].toLowerCase());}else if(obj[k]!=='')upd[k]=obj[k];}});
      if(Object.keys(upd).length) updates.push({id,upd,row:i+1});
    }
    if(!updates.length) throw new Error('No se encontraron cambios para importar.');
    if(!await ask(`Se actualizarán ${updates.length} productos existentes. Los campos vacíos se conservarán. ¿Continuar?`)) return;
    for(const item of updates){const {error}=await sb.from('products').update(item.upd).eq('id',item.id);if(error)throw new Error(`Fila ${item.row}: ${error.message}`);}
    await loadAll();say('csvmsg',`Importación completada: ${updates.length} productos actualizados. Revisa el catálogo.`);
  } catch(e){say('csvmsg','No se pudo importar: '+(e.message||e));}
}

async function orderNeeds(o) {
  const totals = {};
  for (const i of (Array.isArray(o.items) ? o.items : [])) {
    const z = String(i.size || '').toLowerCase();
    if (!i.product_id || !['s','m','l','xl','xxl'].includes(z)) continue;
    const key = `${i.product_id}|${z}`; totals[key] = (totals[key] || 0) + (Number(i.quantity) || 0);
  }
  return totals;
}
async function reserveOrder(id) {
  const o = orders.find(x => String(x.id) === String(id));
  if (!o || o.status !== 'pending') return;
  const needs = await orderNeeds(o), otherReserved = {};
  for (const other of orders.filter(x => isReserved(x) && String(x.id) !== String(id))) {
    for (const [key,q] of Object.entries(await orderNeeds(other))) otherReserved[key] = (otherReserved[key] || 0) + q;
  }
  for (const [key,q] of Object.entries(needs)) {
    const [pid,z] = key.split('|'), p = products.find(x => String(x.id) === String(pid));
    if (!p) return alert('No se encontró un producto del pedido. No se realizó el apartado.');
    const available = stock(p,z.toUpperCase()) - (otherReserved[key] || 0);
    if (available < q) return alert(`No hay suficientes unidades libres de ${p.name}, talla ${z.toUpperCase()}. Disponibles para apartar: ${Math.max(0,available)}; solicitadas: ${q}.`);
  }
  if (!await ask('¿Apartar esta cotización? Las unidades quedarán bloqueadas para otros clientes hasta que la marques como vendida o canceles la cotización.')) return;
  const {error} = await sb.from('orders').update({status:'reserved'}).eq('id',o.id).eq('status','pending');
  if (error) return alert('No se pudo apartar la cotización: '+error.message);
  await loadAll();
}
async function cancelReservation(id) {
  const o = orders.find(x => String(x.id) === String(id));
  if (!o || !isReserved(o)) return;
  if (!await confirmAs('¿Cancelar esta cotización apartada? Las unidades se liberarán y volverán a estar disponibles para otros clientes. El inventario físico no se modificará.', 'Sí, cancelar cotización')) return;
  const {error} = await sb.from('orders').update({status:'cancelled', cancelled_at:new Date().toISOString()}).eq('id',o.id).eq('status','reserved');
  if (error) return alert('No se pudo cancelar el apartado: '+error.message);
  await loadAll();
}

async function markOrderSold(id) {
  const o = orders.find(x => x.id == id); if (!o || isSold(o) || isCancelled(o)) return;

/* Descuenta el inventario de una cotización y la marca como vendida. Devuelve true si todo salió bien. */
async function sellOrder(o) {
  const items = Array.isArray(o.items) ? o.items : [];
  const totals = {};
  items.forEach(i => { const z = String(i.size || '').toLowerCase(); if (!i.product_id || !['s','m','l','xl','xxl'].includes(z)) return; const k = i.product_id; totals[k] = totals[k] || {}; totals[k][z] = (totals[k][z] || 0) + (+i.quantity || 0); });
  // Validar el stock físico descontando las reservas de otros pedidos para no vender unidades comprometidas.
  const reservedByOthers = {};
  for (const other of orders.filter(x => isReserved(x) && String(x.id) !== String(o.id))) {
    for (const [key,q] of Object.entries(await orderNeeds(other))) reservedByOthers[key] = (reservedByOthers[key] || 0) + q;
  }
  for (const [pid, qtys] of Object.entries(totals)) {
    const product = products.find(x => x.id == pid);
    if (!product) { alert('No se encontró uno de los productos de la cotización. No se modificó el inventario.'); return false; }
    for (const [z, q] of Object.entries(qtys)) {
      const key = `${pid}|${z}`, physical = stock(product, z.toUpperCase()), available = physical - (reservedByOthers[key] || 0);
      if (available < q) { alert(`Inventario insuficiente para ${product.name}, talla ${z.toUpperCase()}. Disponible sin afectar apartados: ${Math.max(0,available)}, solicitado: ${q}. No se descontó nada.`); return false; }
    }
  }
  for (const [pid, qtys] of Object.entries(totals)) {
    const product = products.find(x => x.id == pid), update = {};
    Object.entries(qtys).forEach(([z,q]) => update['stock_' + z] = stock(product,z.toUpperCase()) - q);
    const { error } = await sb.from('products').update(update).eq('id', pid);
    if (error) { alert('Error al actualizar el inventario: ' + error.message + '. Verifica las existencias antes de volver a intentarlo.'); await loadAll(); return false; }
  }
  const { error } = await sb.from('orders').update({ status: 'sold', sold_at: new Date().toISOString() }).eq('id', o.id).in('status', ['pending','reserved']);
  if (error) { alert('Se actualizó el inventario, pero no se pudo marcar el pedido como vendido. Contacta al administrador antes de reintentar para evitar un descuento duplicado.'); await loadAll(); return false; }
  await loadAll();
  return true;
}

  const { error } = await sb.from('orders').delete().eq('id', id);

document.addEventListener('keydown', e => { if (e.key === 'Escape' && pos.open) posClose(); });

function posAdd(id, z, d = 1) {
  const p = posProd(id); if (!p) return;
  const i = pos.lines.findIndex(l => l.id == id && l.s == z);
  if (d > 0) {
    const cur = i >= 0 ? pos.lines[i].q : 0;
    if (p.sold_out || cur >= posStock(p, z)) { alert(`Solo hay ${posStock(p, z)} unidades disponibles en talla ${z}.`); return; }
    i >= 0 ? pos.lines[i].q++ : pos.lines.push({ id: p.id, s: z, q: 1 });
  } else if (i >= 0) { pos.lines[i].q--; if (pos.lines[i].q < 1) pos.lines.splice(i, 1); }
  pos.done = null; posRefreshCard(id); posRenderTicket(); posRenderModal();
}
function posRemove(id) { pos.lines = pos.lines.filter(l => l.id != id); posRefreshCard(id); posRenderTicket(); posRenderModal(); }
function posSetCode(v) { pos.code = v; posRenderTicket(); }
function posClear() {

function posRenderTicket() {
  const L = $('#posLines'), T = $('#posTotals'); if (!L || !T) return;
  if (pos.code && !posCodeRow()) { pos.code = ''; const s = $('#posCodeSel'); if (s) s.value = ''; }
  const { n, sub, tot, lines, ctx } = posCalc(), has = lines.length;
  ['posPdfBtn', 'posQuoteBtn', 'posSellBtn'].forEach(id => { const b = $('#' + id); if (b) b.disabled = !has || pos.busy; });
  if (pos.done) {
    L.innerHTML = `<div class="pos-done"><b>✓ Venta registrada</b><span>Pedido #${esc(pos.done.short)} · ${fmt(pos.done.total)}</span><div class="row-actions"><button class="chip" onclick="downloadOrderPdf('${esc(pos.done.id)}')">↓ Descargar PDF</button><button class="chip on" onclick="posClear()">Nueva venta</button></div></div>`;
    T.innerHTML = ''; posRenderBar(0, 0); return;
  }
  const groups = new Map();
  lines.forEach(x => { if (!groups.has(x.p.id)) groups.set(x.p.id, { p: x.p, unit: x.unit, tier: x.tier, code: x.code, q: 0, rows: [] }); const G = groups.get(x.p.id); G.q += x.l.q; G.rows.push(x); });
  L.innerHTML = has ? [...groups.values()].map(G => {
    const id = esc(G.p.id), ctl = G.rows.map(x => `<span class="pos-sz-ctl"><i>${x.l.s}</i><button type="button" aria-label="Restar talla ${x.l.s}" onclick="posAdd('${id}','${x.l.s}',-1)">−</button><b>${x.l.q}</b><button type="button" aria-label="Sumar talla ${x.l.s}" ${x.l.q >= posStock(G.p, x.l.s) ? 'disabled' : ''} onclick="posAdd('${id}','${x.l.s}',1)">+</button></span>`).join('');
    return `<div class="pos-line"><img src="${imgUrl(G.p.image_path)}" alt=""><div class="pos-line-b"><div class="pos-line-h"><b>${esc(G.p.name)}</b><button type="button" class="chip" aria-label="Quitar este diseño" onclick="posRemove('${id}')">✕</button></div>
      <span class="note">${fmt(G.unit)} c/u${G.tier ? ` · ${esc(tierLabel(G.tier))}${G.code ? ' (código)' : ''}` : ''}</span><div class="pos-sizes">${ctl}</div><div class="pos-line-t"><span>${G.q} und.</span><b>${fmt(G.unit * G.q)}</b></div></div></div>`;
  }).join('') : '<p class="note">Toca una talla en las tarjetas para agregar prendas al ticket.</p>';
  const seen = new Set(), hints = [];
  if (!ctx.code) lines.forEach(x => {
    if (seen.has(x.p.id)) return; seen.add(x.p.id);
    const o = nextOffer(x.p, posCat(x.p), tiers, posCount(x.p.id), ctx); if (!o) return;
    hints.push(o.tier.kind === 'pct'
      ? `Con ${o.need} ${o.need == 1 ? 'unidad' : 'unidades'} más de <b>${esc(x.p.name)}</b> queda a ${fmt(o.unit)} c/u (${esc(tierLabel(o.tier))}).`
      : `Precio ${esc(o.tier.name)} para <b>${esc(x.p.name)}</b> (${fmt(o.unit)} c/u): faltan ${o.need} ${o.need == 1 ? 'unidad' : 'unidades'} para ${tierReq(tiers, o.tier)}.`);
  });
  const resumen = SZ.filter(z => ctx.sz[z]).map(z => `${z}: ${ctx.sz[z]}`).join(' · ');
  T.innerHTML = `<div class="pos-tot"><div><span>Unidades</span><b>${n}</b></div><div><span>Subtotal</span><b>${fmt(sub)}</b></div>${sub > tot ? `<div><span>Descuento aplicado</span><b>− ${fmt(sub - tot)}</b></div>` : ''}<div class="pos-final"><span>Total a cobrar</span><b>${fmt(tot)}</b></div></div>
    ${resumen ? `<p class="note">Tallas del pedido → ${resumen}</p>` : ''}${hints.map(h => `<p class="note pos-hint">${h}</p>`).join('')}`;
  posRenderBar(n, tot);
}

function posOrderData(status) {

  return {
    status, total: c.tot, units: c.n,
    items: c.lines.map(x => ({ product_id: x.p.id, product_name: x.p.name, image_url: imgUrl(x.p.image_path), size: x.l.s, quantity: x.l.q, unit_price: x.unit, subtotal: x.unit * x.l.q })),

function posValidate() {
  const c = posCalc(); if (!c.lines.length) { alert('Agrega al menos una prenda al ticket.'); return null; }
  const email = pos.cust.email.trim();
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { alert('El correo electrónico no es válido. Corrígelo o déjalo vacío.'); return null; }
  return c;
}
async function posPdf() {
  if (!posValidate()) return;
  await buildOrderPdf({ ...posOrderData('pending'), id: 'MOSTRADOR', label: 'MOSTRADOR', created_at: new Date().toISOString() });
}
async function posSave(sold) {
  if (pos.busy) return; const c = posValidate(); if (!c) return;
  if (sold) {
    const need = {}; c.lines.forEach(x => { const k = x.p.id + '|' + x.l.s; need[k] = (need[k] || 0) + x.l.q; });
    for (const [k, q] of Object.entries(need)) { const [pid, z] = k.split('|'), p = posProd(pid); if (posStock(p, z) < q) { alert(`Inventario insuficiente para ${p.name}, talla ${z}. Disponible: ${posStock(p, z)}, en el ticket: ${q}.`); return; } }
    if (!await confirmAs(`<b>Total a cobrar: ${fmt(c.tot)}</b><br>${c.n} ${c.n == 1 ? 'unidad' : 'unidades'}. Se registrará la venta y se descontará el inventario.`, 'Sí, registrar venta')) return;
  }
  pos.busy = true; posRenderTicket();
  try {
    const { data, error } = await sb.from('orders').insert(posOrderData('pending')).select();
    if (error || !data || !data[0]) { alert('No se pudo guardar: ' + ((error && error.message) || 'sin respuesta') + '.'); return; }
    const row = data[0]; orders.unshift(row);
    if (!sold) { await loadAll(); posClear(); alert('Cotización guardada en Pedidos como pendiente.'); return; }
    const ok = await sellOrder(row);
    if (!ok) { alert('La cotización quedó guardada como pendiente en Pedidos, pero no se pudo cerrar la venta. Revisa el inventario antes de reintentar.'); return; }
    pos.lines = []; pos.code = ''; pos.cust = { name: '', idn: '', phone: '', address: '', city: '', email: '' };
    pos.done = { id: row.id, short: shortId(row), total: row.total };
    renderPanel();
  } finally { pos.busy = false; if ($('#posTicket')) posRenderTicket(); }
}

let heroBusy = false;
/* Guarda las campañas y comprueba leyendo de vuelta que realmente quedaron en la base de datos.

async function persistHero() {
  const value = JSON.stringify(settings.hero_banners || []);
  const { error } = await sb.from('settings').upsert({ key: 'hero_banners', value });
  if (error) {
    const rls = /row-level security|permission|jwt|not authorized/i.test(error.message || '');
    alert('No se pudo guardar la campaña: ' + error.message + (rls ? '\n\nTu sesión no tiene permiso de escritura. Cierra sesión, entra con el correo administrador (saenz1098@gmail.com) y revisa que supabase.sql esté aplicado.' : ''));
    return false;
  }
  const chk = await sb.from('settings').select('*');
  const saved = (chk.data || []).find(r => r.key === 'hero_banners');
  if (!chk.error && (!saved || saved.value !== value)) { alert('La base de datos no confirmó el guardado de la campaña (la escritura fue bloqueada). Revisa las políticas de la tabla settings con supabase.sql.'); return false; }
  say('heromsg', 'Cambios guardados ✓'); renderHeroAdminList(); return true;
}
/* Crea (i == null) o edita (i = posición) una campaña: sube las fotos en paralelo, evita dobles clics y revierte si falla. */

function cdDown(e) {

  try { el.setPointerCapture(e.pointerId); } catch (err) {}
  const clamp = v => Math.round(Math.min(100, Math.max(0, v)) * 10) / 10;
  el.onpointermove = ev => {
    c.x = clamp(d.x0 + (ev.clientX - d.sx) / d.fw * 100); c.y = clamp(d.y0 + (ev.clientY - d.sy) / d.fh * 100);
    el.style.left = c.x + '%'; el.style.top = c.y + '%'; el.style.transform = `translate(-${c.x}%,-${c.y}%)`;

  };

}

/* Reduce la foto antes de subirla. max = lado mayor en px (productos 1000, campañas más grande).
   - Decodifica respetando la orientación de la cámara.
   - Safari/iPhone no sabe codificar WebP: antes devolvía un PNG pesado etiquetado como .webp (subida lentísima); ahora cae a JPEG. */
async function shrink(file, max = 1000) {
  let bmp; try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { bmp = await createImageBitmap(file); }
  const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); if (bmp.close) bmp.close();
  let blob = await new Promise(r => c.toBlob(r, 'image/webp', .82));
  if (!blob || blob.type !== 'image/webp') blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .85));
  return blob;
}
async function upload(file, max) {
  const blob = await shrink(file, max), ext = blob.type === 'image/webp' ? 'webp' : 'jpg';
  const path = crypto.randomUUID() + '.' + ext;
  const up = sb.storage.from('products').upload(path, blob, { contentType: blob.type, cacheControl: '31536000' });
  const { error } = await Promise.race([up, new Promise((_, rej) => setTimeout(() => rej(new Error('La subida de la foto tardó demasiado. Revisa tu conexión e inténtalo de nuevo.')), 45000))]);
  if (error) throw error; return path;
}

async function saveCat() {
  const n = $('#cn').value.trim(); if (!n) return;
  const selectedSizes = [...document.querySelectorAll('input[name="cn_sizes"]:checked')].map(x => x.value);
  if (!selectedSizes.length) return say('cmsg', 'Selecciona al menos una talla.');
  const { error } = await sb.from('categories').insert({ name: n, sizes: JSON.stringify(selectedSizes), tiers: JSON.stringify(readBoxes('cn_')) });
  if (error) return say('cmsg', 'Error: ' + error.message);
  await loadAll();
}
async function delCat(id) {
  const c = cats.find(x => x.id == id), l = products.filter(p => p.category_id == id);
  if (!await ask(`¿Eliminar la categoría "${c ? c.name : ''}"${l.length ? ` y sus ${l.length} diseños` : ''}?`)) return;
  for (const p of l) { await rmImg(p.image_path); await rmImg(p.image_path_back); }
  const { error } = await sb.from('categories').delete().eq('id', id);
  if (error) return say('cmsg', 'Error: ' + error.message);
  await loadAll();
}
async function saveNew() {
  if (busy) return;
  const name = $('#nn').value.trim(), cat = $('#nc').value; lastCat = cat;
  if (!name) return say('msg', 'Escribe un nombre.');
  const row = { category_id: cat, name, color: $('#ncolor').value.trim(), description: $('#nd').value.trim(), price: +$('#np').value || 0, price_promo: +$('#npp').value || 0, price_dist: +$('#npd').value || 0, price_mayor: +$('#npm').value || 0, tiers: $('#nt_inh').checked ? null : JSON.stringify(readBoxes('nt_')), is_best_seller: $('#nbest').checked, is_last_units: $('#nlast').checked, is_new_arrival: $('#nnew').checked };
  if (guidesOk) row.size_guide_id = $('#ngu').value || null;
  if (weightsOk) row.fabric_weight_id = $('#nwt').value || null;
  SZ.forEach(z => row['stock_' + z.toLowerCase()] = Math.max(0, parseInt($('#ns' + z).value) || 0));
  if (!(row.price > 0)) return say('msg', 'Pon el precio al detal.');
  if (row.price_promo && row.price_promo >= row.price) return say('msg', 'El precio de promoción debe ser menor al precio detal (o déjalo en 0).');
  busy = true; say('msg', 'Guardando…');
  try {
    const f = $('#nf').files[0], fb = backOk && $('#nfb') ? $('#nfb').files[0] : null;
    const [p1, p2] = await Promise.all([f ? upload(f) : null, fb ? upload(fb) : null]);
    if (p1) row.image_path = p1; if (p2) row.image_path_back = p2;
    const ins = sb.from('products').insert(row).select();
    const { data, error } = await Promise.race([ins, new Promise((_, rej) => setTimeout(() => rej(new Error('El guardado tardó demasiado. Recarga la página e inténtalo de nuevo.')), 30000))]);
    if (error) { await rmImg(p1); await rmImg(p2); throw error; }
    if (data && data[0]) products.unshift(data[0]); else await reloadProducts();
    busy = false; renderPanel(); say('msg', '¡Guardado!');
  } catch (e) { busy = false; say('msg', 'Error: ' + (e.message || e)); }
}
async function setPrice(id, field, v) {
  const { error } = await sb.from('products').update({ [field]: +v || 0 }).eq('id', id);
  if (error) alert('No se pudo guardar el precio: ' + error.message); else { const p = products.find(x => x.id == id); if (p) p[field] = +v || 0; }
}
const ruleOut = x => x.kind == 'pct'
  ? { key: x.key, name: x.name || 'Descuento', kind: 'pct', min: Math.max(2, parseInt(x.min) || 2), pct: Math.min(90, Math.max(0, +x.pct || 0)) }
  : { key: x.key, total: x.total, sizes: x.sizes, flex: x.flex };
async function writeRules(list, gone) {
  const r1 = await sb.from('settings').upsert({ key: 'rules', value: JSON.stringify(list) });
  if (r1.error) return r1.error;
  if (gone) { const r2 = await sb.from('settings').upsert({ key: 'rules_deleted', value: JSON.stringify(gone) }); if (r2.error) return r2.error; }
  return null;
}
async function addCustomRule() {
  const name = $('#newRuleName').value.trim(), min = parseInt($('#newRuleMin').value, 10), pct = parseInt($('#newRulePct').value, 10);
  if (!name) return say('newRuleMsg', 'Escribe un nombre para la regla.');
  if (!Number.isInteger(min) || min < 2) return say('newRuleMsg', 'La cantidad mínima debe ser 2 o más.');
  if (!Number.isInteger(pct) || pct < 1 || pct > 90) return say('newRuleMsg', 'El descuento debe estar entre 1% y 90%.');
  const key = 'custom_' + Date.now().toString(36), next = [...tiers.map(ruleOut), { key, name, kind: 'pct', min, pct }];
  const error = await writeRules(next);
  if (error) return say('newRuleMsg', 'No se pudo crear: ' + error.message);
  await loadAll(); say('newRuleMsg', 'Regla creada. Ahora puedes asignarla al producto o categoría.');
}
async function deleteRule(key) {
  const t = tiers.find(x => x.key === key); if (!t || t.kind !== 'pct') return;
  if (!await ask(`¿Eliminar la regla "${t.name}" (${t.pct}% desde ${t.min} unidades)? Se quitará también de las categorías y productos que la usen.`)) return;
  const isDefault = DEF_TIERS.some(d => d.key === key);
  const gone = isDefault ? [...new Set([...deletedRules, key])] : deletedRules;
  const error = await writeRules(tiers.filter(x => x.key !== key).map(ruleOut), isDefault ? gone : null);
  if (error) return say('tmsg', 'No se pudo eliminar: ' + error.message);
  /* Limpia la regla de las listas de categorías y productos (si no, quedarían claves huérfanas). */
  const strip = async (table, rows) => { for (const r of rows) { const k = parseKeys(r.tiers); if (k && k.includes(key)) await sb.from(table).update({ tiers: JSON.stringify(k.filter(x => x !== key)) }).eq('id', r.id); } };
  try { await strip('categories', cats); await strip('products', products); } catch (e) {}
  await loadAll(); say('tmsg', 'Regla eliminada ✓');
}

async function saveRules() {
  const t = tiers.map(x => x.kind == 'pct'
    ? ruleOut({ key: x.key, name: ($('#tn_' + x.key) ? $('#tn_' + x.key).value.trim() : x.name), kind: 'pct', min: $('#tm_' + x.key).value, pct: $('#tp_' + x.key).value })
    : { key: x.key, total: Math.max(1, parseInt($('#tt_' + x.key).value) || 1), sizes: Math.min(SZ.length, Math.max(1, parseInt($('#ts_' + x.key).value) || 1)), flex: Math.min(SZ.length, Math.max(1, parseInt($('#tf_' + x.key).value) || 1)) });
  /* Ya no se bloquea por cantidades repetidas: en cada producto gana la regla activa de menor precio. */
  const e1 = await writeRules(t);
  const e2 = e1 ? null : (await sb.from('settings').upsert({ key: 'count_mode', value: $('#cm').value })).error;
  if (!e1 && !e2) await loadAll();
  say('tmsg', e1 || e2 ? 'Error: ' + (e1 || e2).message : 'Guardado ✓');
}
const genCode = () => { const ch = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; const r = crypto.getRandomValues(new Uint32Array(8)); r.forEach(n => s += ch[n % ch.length]); $('#wck').value = s; };
async function saveCode() {
  const code = $('#wck').value.trim().toUpperCase(), name = $('#wcc').value.trim();
  if (code.length < 6) return say('wcmsg', 'El código debe tener al menos 6 caracteres (usa Generar).');
  const { error } = await sb.from('wholesale_codes').insert({ code, client_name: name, active: true });
  if (error) return say('wcmsg', /duplicate|unique/i.test(error.message) ? 'Ese código ya existe.' : 'Error: ' + error.message);
  await loadAll();
}
async function toggleCode(id) { const k = codes.find(x => x.id == id); await sb.from('wholesale_codes').update({ active: !k.active }).eq('id', id); await loadAll(); }
async function delCode(id) { if (!await ask('¿Eliminar este código de mayorista?')) return; await sb.from('wholesale_codes').delete().eq('id', id); await loadAll(); }
/* Una foto puede estar compartida con una copia (Duplicar): solo se borra del almacenamiento si ningún otro producto la usa. */
const imgInUse = (path, id) => products.some(x => x.id != id && (x.image_path === path || x.image_path_back === path));
const rmImgFree = async (path, id) => { if (path && !imgInUse(path, id)) await rmImg(path); };
async function newPhoto(id, f, side) {
  if (!f) return; const p = products.find(x => x.id == id), col = side === 'back' ? 'image_path_back' : 'image_path';
  try {
    const path = await upload(f);
    const { error } = await sb.from('products').update({ [col]: path }).eq('id', id); if (error) { await rmImg(path); throw error; }
    await rmImgFree(p && p[col], id); await reloadProducts(); renderPanel(); focusProduct(id);
  } catch (e) { alert('No se pudo subir la foto: ' + (e.message || e)); }
}
async function removeBack(id) {
  const p = products.find(x => x.id == id); if (!p || !p.image_path_back) return;
  if (!await ask('¿Quitar la foto trasera de este producto?')) return;
  const { error } = await sb.from('products').update({ image_path_back: null }).eq('id', id);
  if (error) return alert('No se pudo quitar la foto: ' + error.message);
  await rmImgFree(p.image_path_back, id); await reloadProducts(); renderPanel(); focusProduct(id);
}
async function duplicateProduct(id) {
  const p=products.find(x=>x.id===id); if(!p) return;
  const copy={...p}; delete copy.id; delete copy.created_at;
  copy.name=(p.name||'Producto')+' (copia)'; copy.stock_s=0;copy.stock_m=0;copy.stock_l=0;copy.stock_xl=0;copy.sold_out=true;
  if(!await ask(`Crear una copia de “${p.name}” con inventario en cero?`)) return;
  const {error}=await sb.from('products').insert(copy);
  if(error) return alert('No se pudo duplicar el producto: '+error.message);
  await loadAll();
}
async function toggleSold(id) {
  const p = products.find(x => x.id == id);
  await sb.from('products').update({ sold_out: !p.sold_out }).eq('id', id); await reloadProducts(); renderPanel(); focusProduct(id);
}
async function del(id) {
  if (!await ask('¿Eliminar este diseño definitivamente?')) return;
  const p = products.find(x => x.id == id);
  const { error } = await sb.from('products').delete().eq('id', id);
  if (error) return alert('No se pudo eliminar: ' + error.message);
  products = products.filter(x => x.id != id);
  await rmImgFree(p && p.image_path, id); await rmImgFree(p && p.image_path_back, id); await loadAll();
}
async function saveWa(v) {
  const { error } = await sb.from('settings').upsert({ key: 'whatsapp', value: v.trim() || C.WHATSAPP });
  say('wmsg', error ? 'Error: ' + error.message : 'Guardado ✓');
}
function exportBackup() {
  const snapshot = LOCAL ? localExport() : { exported_at:new Date().toISOString(), note:'Copia de datos descargada desde IZAN Admin. Contiene información de clientes/pedidos; guárdala en un lugar privado.', categories:cats, products, settings, wholesale_codes:codes, orders, size_guides:guides, fabric_weights:weights, inventory_movements:movements };
  const blob = new Blob([JSON.stringify(snapshot,null,2)], { type: 'application/json' });
  const l = document.createElement('a'); l.href = URL.createObjectURL(blob); l.download = 'izan-copia-' + new Date().toISOString().slice(0, 10) + '.json'; l.click(); setTimeout(()=>URL.revokeObjectURL(l.href),1000);
}
async function importBackup(f) {
  if (!f || !await ask('Esto reemplazará todo lo que hay ahora en modo local. ¿Continuar?')) return;
  try { localImport(JSON.parse(await f.text())); await loadAll(); } catch (e) { alert('Archivo no válido.'); }
}
init();
</script>
